<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}"></head>

<body>
    <header th:replace="~{fragments :: header}"></header>

    <main class="container mt-4">
        <!-- Book Header Card -->
        <div class="row mb-4">
            <div class="col-md-8 mx-auto">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <div class="row align-items-center">
                            <div class="col-md-3">
                                <img th:if="${book.front != null}" 
                                     th:src="@{${book.front}}" 
                                     class="img-fluid rounded shadow-sm"
                                     style="max-height: 200px; object-fit: cover;"
                                     alt="Book cover">
                                <div th:unless="${book.front != null}" 
                                     class="bg-secondary d-flex align-items-center justify-content-center text-white rounded"
                                     style="height: 200px;">
                                    <i class="bi bi-book display-4"></i>
                                </div>
                            </div>
                            <div class="col-md-9">
                                <h2 class="card-title fw-bold mb-2" th:text="${book.title}">Book Title</h2>
                                <p class="text-muted mb-0">Reviews from our community</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reviews Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="mb-0">
                        <i class="bi bi-chat-quote me-2"></i>
                        <span th:text="${#lists.size(valorationList)}">0</span> Reviews
                    </h3>
                    <a th:href="@{/book/valoration/new/{id}(id=${book.id})}" 
                       class="btn btn-success">
                        <i class="bi bi-star me-2"></i>Add Your Review
                    </a>
                </div>
            </div>
        </div>

        <!-- Reviews Table -->
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-body">
                        <!-- Reviews Table -->
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>Reviewer</th>
                                        <th>Rating</th>
                                        <th>Review</th>
                                        <th class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="valoration : ${valorationList}">
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <div class="avatar bg-primary rounded-circle d-flex align-items-center justify-content-center text-white me-2"
                                                     style="width: 40px; height: 40px;">
                                                    <i class="bi bi-person-fill"></i>
                                                </div>
                                                <div>
                                                    <div class="fw-bold" th:text="${valoration.username}">Username</div>
                                                    <small class="text-muted">Book reviewer</small>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <span class="me-1" th:text="${valoration.points}">4.5</span>
                                                <div class="star-rating">
                                                    <i class="bi bi-star-fill text-warning"></i>
                                                    <i class="bi bi-star-fill text-warning"></i>
                                                    <i class="bi bi-star-fill text-warning"></i>
                                                    <i class="bi bi-star-fill text-warning"></i>
                                                    <i class="bi bi-star-fill text-warning"></i>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="review-content">
                                                <p class="mb-0" th:text="${valoration.comments}">Review text content goes here...</p>
                                                <small class="text-muted">
                                                    <i class="bi bi-clock me-1"></i>
                                                    <!-- You could add date here if available -->
                                                    Recent review
                                                </small>
                                            </div>
                                        </td>
                                        <td class="text-center">
                                            <div class="btn-group btn-group-sm" role="group">
                                                <a th:href="@{/book/valoration/edit/{id}(id=${valoration.id})}" 
                                                   class="btn btn-outline-warning" 
                                                   title="Edit Review">
                                                    <i class="bi bi-pencil"></i>
                                                </a>
                                                <a th:href="@{/valoration/delete/{id}(id=${valoration.id})}" 
                                                   class="btn btn-outline-danger" 
                                                   title="Delete Review"
                                                   onclick="return confirm('Are you sure you want to delete this review?')">
                                                    <i class="bi bi-trash"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Empty State -->
                        <div th:if="${#lists.isEmpty(valorationList)}" class="text-center py-5">
                            <i class="bi bi-chat-quote display-1 text-muted"></i>
                            <h4 class="mt-3 text-muted">No Reviews Yet</h4>
                            <p class="text-muted">Be the first to share your thoughts about this book!</p>
                            <a th:href="@{/book/valoration/new/{id}(id=${book.id})}" class="btn btn-primary">
                                <i class="bi bi-plus-circle me-2"></i>Write First Review
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Back to Book Button -->
        <div class="row">
            <div class="col-12 text-center">
                <a th:href="@{/book/{id}(id=${book.id})}" class="btn btn-outline-primary btn-lg">
                    <i class="bi bi-arrow-left me-2"></i>Back to Book Details
                </a>
            </div>
        </div>
    </main>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</body>

</html>
