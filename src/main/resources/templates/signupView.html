<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}"></head>

<body>
    <header th:replace="~{fragments :: header}"></header>

    <main class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <!-- Header -->
                        <div class="text-center mb-4">
                            <h2 class="card-title fw-bold text-primary">Create Account</h2>
                            <p class="text-muted">Join our community of book lovers</p>
                        </div>

                        <!-- Signup Form -->
                        <form th:action="@{/public/signup/submit}" th:object="${formUser}" method="post">
                            <!-- Username Field -->
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" 
                                           class="form-control" 
                                           th:field="*{username}" 
                                           placeholder="Choose a username"
                                           required>
                                </div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" 
                                           class="form-control" 
                                           th:field="*{password}" 
                                           placeholder="Create a password"
                                           required>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-person-plus me-2"></i>Sign Up
                                </button>
                            </div>

                            <!-- Cancel Link -->
                            <div class="text-center">
                                <a th:href="@{/public/home}" class="text-muted text-decoration-none">
                                    <i class="bi bi-arrow-left me-1"></i>Back to Home
                                </a>
                            </div>
                        </form>

                        <!-- Divider -->
                        <div class="divider d-flex align-items-center my-4">
                            <span class="flex-grow-1 border-top"></span>
                            <span class="px-3 text-muted small">OR</span>
                            <span class="flex-grow-1 border-top"></span>
                        </div>

                        <!-- Login Link -->
                        <div class="text-center">
                            <p class="mb-0">Already have an account?</p>
                            <a th:href="@{/login}" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Log In
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Benefits -->
                <div class="mt-4">
                    <div class="card border-0 bg-light">
                        <div class="card-body p-3">
                            <h6 class="card-title fw-bold mb-3">Why join us?</h6>
                            <ul class="list-unstyled mb-0 small">
                                <li class="mb-2">
                                    <i class="bi bi-check-circle text-success me-2"></i>
                                    Rate and review books
                                </li>
                                <li class="mb-2">
                                    <i class="bi bi-check-circle text-success me-2"></i>
                                    Track your reading progress
                                </li>
                                <li>
                                    <i class="bi bi-check-circle text-success me-2"></i>
                                    Get personalized recommendations
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</body>

</html>
