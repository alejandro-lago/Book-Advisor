<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}"></head>

<body>
    <header th:replace="~{fragments :: header}"></header>

    <main class="container mt-4">
        <!-- Page Header -->
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="display-5 fw-bold text-primary">Book Collection</h1>
                <p class="lead">Browse and discover amazing books from our library</p>
            </div>
        </div>

        <!-- Search and Filter Section -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Search & Filter</h5>
                <form th:action="@{/book/filter}" th:object="${filterBook}" method="get" class="row g-3">
                    <div class="col-md-5">
                        <label for="title" class="form-label">Search by Title</label>
                        <input type="text" class="form-control" th:field="*{title}" placeholder="Enter book title...">
                    </div>
                    <div class="col-md-4">
                        <label for="genre" class="form-label">Filter by Genre</label>
                        <select class="form-select" th:field="*{genre}">
                            <option value="">All Genres</option>
                            <option th:each="g : ${genreList}" th:value="${g.id}" th:text="${g.name}"
                                th:selected="${g.id} == ${filterBook.genre?.id}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="btn-group w-100" role="group">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-search"></i> Search
                            </button>
                            <a th:href="@{/book}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-clockwise"></i> Reset
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Add New Book Button -->
        <div class="row mb-4">
            <div class="col-12">
                <a th:href="@{/book/new}" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> Add New Book
                </a>
            </div>
        </div>

        <!-- Books Grid -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>Cover</th>
                                        <th>Title</th>
                                        <th>Author</th>
                                        <th>Genre</th>
                                        <th>Language</th>
                                        <th>Rating</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="book : ${bookList}">
                                        <td>
                                            <img th:if="${book.front != null}" 
                                                 th:src="@{${book.front}}" 
                                                 class="img-thumbnail" 
                                                 style="width: 60px; height: 80px; object-fit: cover;"
                                                 alt="Book cover">
                                            <div th:unless="${book.front != null}" 
                                                 class="bg-secondary d-flex align-items-center justify-content-center text-white"
                                                 style="width: 60px; height: 80px;">
                                                <i class="bi bi-book"></i>
                                            </div>
                                        </td>
                                        <td>
                                            <a th:href="@{/book/{id}(id=${book.id})}" 
                                               class="text-decoration-none fw-bold"
                                               th:text="${book.title}">Book Title</a>
                                        </td>
                                        <td th:text="${book.author}">Author</td>
                                        <td>
                                            <span class="badge bg-info text-dark" th:text="${book.genre}">Genre</span>
                                        </td>
                                        <td>
                                            <span class="badge bg-secondary" th:text="${book.language}">Language</span>
                                        </td>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <span class="me-1" th:text="${book.points}">4.5</span>
                                                <i class="bi bi-star-fill text-warning"></i>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="btn-group btn-group-sm" role="group">
                                                <a th:href="@{/book/{id}(id=${book.id})}" 
                                                   class="btn btn-outline-primary" 
                                                   title="View Details">
                                                    <i class="bi bi-eye"></i>
                                                </a>
                                                <a th:href="@{/book/edit/{id}(id=${book.id})}" 
                                                   class="btn btn-outline-warning" 
                                                   title="Edit">
                                                    <i class="bi bi-pencil"></i>
                                                </a>
                                                <a th:href="@{/book/delete/{id}(id=${book.id})}" 
                                                   class="btn btn-outline-danger" 
                                                   title="Delete"
                                                   onclick="return confirm('Are you sure you want to delete this book?')">
                                                    <i class="bi bi-trash"></i>
                                                </a>
                                                <a th:href="@{/book/valoration/{id}(id=${book.id})}" 
                                                   class="btn btn-outline-success" 
                                                   title="Add Review">
                                                    <i class="bi bi-star"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Empty State -->
                        <div th:if="${#lists.isEmpty(bookList)}" class="text-center py-5">
                            <i class="bi bi-book display-1 text-muted"></i>
                            <h4 class="mt-3 text-muted">No books found</h4>
                            <p class="text-muted">Try adjusting your search criteria or add a new book to the collection.</p>
                            <a th:href="@{/book/new}" class="btn btn-primary">
                                <i class="bi bi-plus-circle"></i> Add Your First Book
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</body>

</html>
