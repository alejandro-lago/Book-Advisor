<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <title>Book-Advisor</title>
    <meta charset="UTF-8" th:fragment="commonMeta" />
    <meta name="viewport" content="width=device-width, initial-scale=1" th:fragment="commonMeta" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="/css/styles.css" th:fragment="commonStyles" />
</head>

<body>
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/public/home}">Book-Advisor</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" th:href="@{/public/who}">Who Are We</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/public/book}">Books</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/public/genre}">Genres</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/user}">Users</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/public/contact}">Contact</a></li>
                        <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="nav-link"
                                th:href="@{/public/signup}">Sign-Up</a></li>
                        <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="nav-link"
                                th:href="@{/login}">Log-In</a></li>
                        <ul class="navbar-nav">
                            <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                    aria-expanded="false">
                                    <span
                                        th:text="${#strings.substring(#authentication.principal.authorities[0].authority, 5)}">USER</span>
                                </a>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" th:href="@{/profile/valorations}">My Valorations</a>
                                    </li>
                                    <li><a class="dropdown-item" th:href="@{/profile/edit}">Edit Profile</a></li>
                                    <li><a class="dropdown-item" th:href="@{/profile/change-password}">Change
                                            Password</a></li>
                                    <li>
                                        <hr class="dropdown-divider">
                                    </li>
                                    <li>
                                        <form th:action="@{/logout}" method="post">
                                            <button class="dropdown-item" type="submit">Log-Out</button>
                                        </form>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                </div>
            </div>
        </nav>
    </header>
</body>

</html>
